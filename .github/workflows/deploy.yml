name: Deploy to GitHub Pages

# Builds the Vite app (env is baked in from the committed .env.production —
# no repository secrets needed) and publishes the static site to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the built-in GITHUB_TOKEN needs to publish Pages.
# id-token is used by the Pages deployment — this is NOT a user-added secret.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA fallback + disable Jekyll
        # GitHub Pages serves 404.html for unknown routes; an SPA copy lets
        # client-side routes (e.g. /support, /admin) load on direct navigation.
        # .nojekyll keeps Pages from stripping files/dirs it considers special.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
