    <circle cx="16" cy="27" r="4.5" fill="white"/>
    <circle cx="17" cy="27" r="2.6" fill="#010003"/>
  </g>

  <!-- Decorative fish (bottom-left) -->
  <g transform="translate(80,440) scale(1.6)" opacity="0.25">
    <path d="M72 30 C88 12 100 4 100 4 L94 30 L100 56 C100 56 88 48 72 30 Z" fill="#4377C2" opacity="0.9"/>
    <ellipse cx="40" cy="30" rx="36" ry="23" fill="#7299D1"/>
    <ellipse cx="29" cy="24" rx="13" ry="7.5" fill="#C2D3ED" opacity="0.45"/>
    <circle cx="16" cy="27" r="4.5" fill="white"/>
    <circle cx="17" cy="27" r="2.6" fill="#010003"/>
  </g>

  <!-- Logo fish glyph -->
  <g transform="translate(200,200) scale(3.5)">
    <path d="M72 30 C88 12 100 4 100 4 L94 30 L100 56 C100 56 88 48 72 30 Z" fill="#D97AB5" opacity="0.9"/>
    <ellipse cx="40" cy="30" rx="36" ry="23" fill="#EA92CB"/>
    <ellipse cx="29" cy="24" rx="13" ry="7.5" fill="#F7D3E9" opacity="0.5"/>
    <circle cx="16" cy="27" r="4.5" fill="white"/>
    <circle cx="17" cy="27" r="2.6" fill="#010003"/>
    <circle cx="18" cy="26" r="1" fill="white" opacity="0.85"/>
  </g>

  <!-- BackBonz wordmark -->
  <text x="560" y="260" font-family="ui-rounded, system-ui, sans-serif" font-weight="700" font-size="96" fill="#010003" text-anchor="middle">BackBonz</text>

  <!-- Tagline -->
  <text x="560" y="340" font-family="ui-rounded, system-ui, sans-serif" font-weight="400" font-size="36" fill="#343335" text-anchor="middle">Brace tracking for teens with scoliosis</text>

