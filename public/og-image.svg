      <stop offset="0%" stop-color="#F7D3E9"/>
      <stop offset="50%" stop-color="#FBF1B9"/>
      <stop offset="100%" stop-color="#F2BEDE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative fish (top-right) -->
  <g transform="translate(960,80) scale(2.2)" opacity="0.35">
    <path d="M72 30 C88 12 100 4 100 4 L94 30 L100 56 C100 56 88 48 72 30 Z" fill="#D97AB5" opacity="0.9"/>
    <ellipse cx="40" cy="30" rx="36" ry="23" fill="#EA92CB"/>
